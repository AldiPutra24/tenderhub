{% extends "base.html" %}
{% load static %}

{% block title %}Email Reset Dikirim - GPFE PROC HUB{% endblock %}

{% block body %}
<main class="min-h-screen bg-slate-50">
    <section class="flex min-h-screen items-center justify-center px-4 py-10 sm:px-6">
        <div class="app-panel w-full max-w-md p-6 text-center sm:p-8">
            <img src="{% static 'img/logo.png' %}" alt="GPFE PROC HUB" class="mx-auto mb-4 h-12 w-12 object-contain">
            <p class="text-sm font-medium text-slate-500">Reset kata sandi</p>
            <h1 class="mt-2 text-2xl font-semibold tracking-tight text-slate-950">Cek email Anda</h1>
            <p class="mt-3 text-sm leading-6 text-slate-600">
                Jika email terdaftar dan aktif, kami mengirim tautan untuk mengatur ulang kata sandi.
            </p>
            <a href="{% url 'login' %}" class="btn-primary mt-6 h-11 px-5 text-sm">
                Kembali ke Masuk
            </a>
        </div>
    </section>
</main>
{% endblock %}
